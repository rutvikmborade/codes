<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label>Portfollio</label>
      <fieldset>
        <legend>Personal Info</legend>
        <label >Full Name: </label>
        <input type="text">
        <br>
         <label >Phone NO: </label>
        <input type="number">
        <br>
         <label >Email: </label>
        <input type="email">
        <br>
         <label >DOB: </label>
        <input type="date">
        <br>
         <label >Age: </label>
        <input type="number">
        <br>
         <label >Gender</label>
        <input type="radio" checked>Male
        <input type="radio" >Female
        <br>
        <select aria-placeholder="Select coyuntry">
            <option value="">India</option>
            <option value="">USA</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Profile Info</legend>
         <label >Year of Experience</label>
        <input type="number" placeholder="Enter Experience">
        <br>
         <label >Dev Type</label>
        <input type="checkbox">Mobile
        <input type="checkbox" name="" id="">Flutter
        <br>
         <label >Skill Range</label>
        <input type="range">
        <br> 
        <label >File</label>
        <input type="file">
        <br>

      </fieldset>
      <fieldset>
        <legend>Extra</legend>
         <label >Hobbies</label>
        <input type="checkbox">Sports
        <input type="checkbox">Reading
        <input type="checkbox">Music
        <br>
        <label >Other achivements: </label> 
        <input type="text">
        </fieldset>
        <input type="reset">
        <input type="submit">



      
    </form>
  </body>
</html>
